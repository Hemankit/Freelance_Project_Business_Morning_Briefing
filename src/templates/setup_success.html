<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Successful</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .success-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            text-align: center;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 48px;
            color: #2e8b57;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>
    <main class="success-card">
        <div class="success-icon" aria-hidden="true">✓</div>

        <h1>Connection Successful</h1>

        <p>Your account has been connected successfully. You may close this page.</p>
    </main>
</body>
</html>
